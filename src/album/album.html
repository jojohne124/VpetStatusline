<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<title>vpet 圖鑑</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0d1117;color:#c9d1d9;
            font-family:ui-monospace,Consolas,"Microsoft JhengHei",monospace}
  #bar{display:flex;align-items:center;gap:14px;padding:9px 14px;background:#161b22;border-bottom:1px solid #30363d;font-size:13px}
  #bar h1{font-size:15px;color:#58a6ff;margin:0}
  #count{color:#8b949e}
  #count b{color:#e6edf3}
  #hint{margin-left:auto;color:#7f868e;font-size:11px}
  /* 拖曳平移 + 滾輪縮放，內容用 transform 移動 */
  #view{position:absolute;inset:44px 0 0 0;overflow:hidden;cursor:grab}
  #view.drag{cursor:grabbing}
  #world{position:absolute;transform-origin:0 0}
  #edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
  /* 寬度釘死＝canvas 66px（64 + 左右框線）。不能讓名字把節點撐寬 ——
     .node 是絕對定位、內容置中，一撐寬 canvas 就會往右位移，連線的錨點（見 layout()
     的 x1/x2 是以 canvas 位置算的）就對不上了。名字改用負 margin 往兩側溢出。 */
  .node{position:absolute;width:66px;text-align:center;cursor:pointer;user-select:none}
  .node canvas{image-rendering:pixelated;display:block;border-radius:5px;background:#161b22;border:1px solid #30363d}
  .node.own canvas{border-color:#3fb950}
  /* 名字完整顯示，不截斷。66 + 31*2 = 128px < COL_W(140)，左右各留 6px 不會黏到隔壁欄。
     等寬字 11px 約 6.05px/字，最長的 HerculesKabuterimon（19 字）約 115px，單行放得下；
     真的更長就靠 overflow-wrap 折成兩行（ROW_H 已預留高度）。 */
  .node .nm{font-size:11px;line-height:1.2;margin:3px -31px 0;color:#8b949e;
            white-space:normal;overflow-wrap:anywhere}
  .node.own .nm{color:#e6edf3}
  .node:hover canvas{border-color:#58a6ff}
  /* CutIn 彈窗 */
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:20}
  #modal.show{display:flex}
  #mbox{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:16px;text-align:center}
  #mbox canvas{image-rendering:pixelated;display:block;background:rgb(30,30,30);border-radius:6px}
  #mname{margin-top:10px;font-size:14px;color:#e6edf3}
  #mat{font-size:11px;color:#7f868e;margin-top:3px}
  #empty{position:absolute;inset:44px 0 0 0;display:flex;align-items:center;justify-content:center;
         color:#7f868e;font-size:13px;line-height:2;text-align:center}
</style></head><body>
<div id="bar">
  <h1>📖 vpet 圖鑑</h1>
  <span id="count">–</span>
  <span id="hint">拖曳平移　滾輪縮放　點角色看 CutIn</span>
</div>
<div id="view"><div id="world"><svg id="edges"></svg></div></div>
<div id="empty" style="display:none"></div>
<div id="modal"><div id="mbox"><canvas id="mcv"></canvas><div id="mname"></div><div id="mat"></div></div></div>

<script>
const CELL=4;                 // idle 縮圖：1 邏輯像素 = 4x4
const COL_W=140, ROW_H=112;   // 節點間距（ROW_H 含兩行名字的空間：canvas 66 + 名字最多 24）
const $=id=>document.getElementById(id);

// 蒐集程度：分子分母 + 百分比，百分比**無條件捨去**。
//
// floor 而不是 round：199/200 四捨五入是 100%，而「看到 100% 卻還有一隻沒收」
// 是最惱人的那種假訊息。只有真的收滿才給 100%。
// owned >= total 才夾成 100 —— 這一條同時擋掉「owned 大於 total」時算出 101% 的情況。
// total=0（資產讀不到、或 roster 空的）不能謊報 100%：一隻都沒有不該算收滿。
function countLabel(owned, total){
  if(!total) return '已收錄 <b>0</b> / 0　<b>0%</b>';
  const pct = owned >= total ? 100 : Math.floor(owned / total * 100);
  return `已收錄 <b>${owned}</b> / ${total}　<b>${pct}%</b>`;
}
const view=$('view'), world=$('world'), edges=$('edges');
let DATA=null, frame=0, cvs=[];
let tx=40, ty=40, scale=1;

function applyTransform(){ world.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`; }

// 半格 cell 陣列 → canvas。cell = [tr,tg,tb,br,bg,bb]，-1 表該半格透明。
function drawCells(cv, cells, px){
  if(!cells||!cells.length) return;
  const cols=cells[0].length, rows=cells.length;
  cv.width=cols*px; cv.height=rows*px*2;
  const c=cv.getContext('2d');
  c.clearRect(0,0,cv.width,cv.height);
  cells.forEach((row,ry)=>row.forEach((cell,cx)=>{
    if(!cell) return;
    const [tr,tg,tb,br,bg,bb]=cell;
    if(tr>=0){ c.fillStyle=`rgb(${tr},${tg},${tb})`; c.fillRect(cx*px, ry*px*2, px, px); }
    if(br>=0){ c.fillStyle=`rgb(${br},${bg},${bb})`; c.fillRect(cx*px, ry*px*2+px, px, px); }
  }));
}

function layout(){
  const n=DATA.nodes;
  if(!n.length){
    $('empty').style.display='flex';
    $('empty').innerHTML='圖鑑還是空的。<br>養一隻 vpet 就會開始記錄。';
    return;
  }
  $('empty').style.display='none';
  const minRow=Math.min(...n.map(x=>x.row));
  const pos={};
  n.forEach(x=>{ pos[x.id]={x:x.col*COL_W, y:(x.row-minRow)*ROW_H}; });

  // 連線（先畫，才會在節點底下）
  const W=Math.max(...n.map(x=>pos[x.id].x))+COL_W, H=Math.max(...n.map(x=>pos[x.id].y))+ROW_H;
  edges.setAttribute('width',W); edges.setAttribute('height',H);
  edges.innerHTML=DATA.edges.map(e=>{
    const a=pos[e.from], b=pos[e.to]; if(!a||!b) return '';
    const x1=a.x+72, y1=a.y+34, x2=b.x+4, y2=b.y+34;
    const mx=(x1+x2)/2;
    return `<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" fill="none" stroke="#30363d" stroke-width="2"/>`;
  }).join('');

  // 節點
  document.querySelectorAll('.node').forEach(el=>el.remove());
  cvs=[];
  for(const x of n){
    const d=document.createElement('div');
    d.className='node'+(x.raised?' own':'');
    d.style.left=pos[x.id].x+'px'; d.style.top=pos[x.id].y+'px';
    const cv=document.createElement('canvas');
    const nm=document.createElement('div'); nm.className='nm'; nm.textContent=x.name;
    d.appendChild(cv); d.appendChild(nm);
    d.addEventListener('click',ev=>{ ev.stopPropagation(); if(x.raised) openCutin(x); });
    world.appendChild(d);
    if(x.art) cvs.push({cv, art:x.art});
  }
  tick();
}

// idle_1 / idle_2 交替（養過的才動；黑影也用同一份幀，動起來比較有生氣）
function tick(){
  for(const o of cvs) drawCells(o.cv, o.art.frames[frame%o.art.frames.length], CELL);
}
setInterval(()=>{ frame^=1; tick(); }, 600);

async function openCutin(x){
  try{
    const r=await (await fetch('/cutin?char='+encodeURIComponent(x.id))).json();
    drawCells($('mcv'), r.cells, 8);
  }catch(e){}
  $('mname').textContent=x.name;
  $('mat').textContent=x.at?('取得於 '+new Date(x.at).toLocaleString()):'';
  $('modal').classList.add('show');
}
$('modal').addEventListener('click',()=>$('modal').classList.remove('show'));
addEventListener('keydown',e=>{ if(e.key==='Escape')$('modal').classList.remove('show'); });

// 平移 / 縮放
let drag=null;
view.addEventListener('mousedown',e=>{ drag={x:e.clientX-tx,y:e.clientY-ty}; view.classList.add('drag'); });
addEventListener('mouseup',()=>{ drag=null; view.classList.remove('drag'); });
addEventListener('mousemove',e=>{ if(!drag)return; tx=e.clientX-drag.x; ty=e.clientY-drag.y; applyTransform(); });
view.addEventListener('wheel',e=>{
  e.preventDefault();
  const b=view.getBoundingClientRect(), mx=e.clientX-b.left, my=e.clientY-b.top;
  const k=e.deltaY<0?1.1:1/1.1, ns=Math.max(.3,Math.min(3,scale*k));
  // 以游標為中心縮放
  tx=mx-(mx-tx)*(ns/scale); ty=my-(my-ty)*(ns/scale); scale=ns;
  applyTransform();
},{passive:false});

(async()=>{
  DATA=await (await fetch('/data')).json();
  $('count').innerHTML=countLabel(DATA.owned, DATA.total);
  applyTransform();
  layout();
})();
</script></body></html>
