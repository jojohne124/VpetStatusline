<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>進化路線編輯器</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: "Segoe UI", "Microsoft JhengHei", sans-serif; background: #1a1d21; color: #e6e6e6; overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100%; }
  #toolbar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: #23272e; border-bottom: 1px solid #333; flex-wrap: wrap; }
  #toolbar button { background: #3a4048; color: #e6e6e6; border: 1px solid #4a515a; border-radius: 5px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
  #toolbar button:hover { background: #464d57; }
  #toolbar button.primary { background: #2d7d46; border-color: #2d7d46; }
  #toolbar button.primary:hover { background: #359152; }
  #toolbar button.active { background: #b8862d; border-color: #b8862d; }
  #toolbar label { font-size: 13px; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
  #toolbar input[type=text] { background: #1a1d21; border: 1px solid #4a515a; color: #e6e6e6; border-radius: 5px; padding: 5px 8px; font-size: 13px; width: 130px; }
  #status { font-size: 12px; color: #9aa0a8; margin-left: auto; }
  #deadBadge { background: #c0392b; color: #fff; border-radius: 10px; padding: 2px 9px; font-size: 12px; display: none; }
  #deadBadge.show { display: inline-block; }
  .dropdown { position: relative; display: inline-block; }
  .menu { position: absolute; top: 100%; left: 0; margin-top: 5px; background: #23272e; border: 1px solid #4a515a; border-radius: 7px; padding: 8px; max-height: 62vh; overflow-y: auto; z-index: 30; min-width: 190px; box-shadow: 0 6px 20px #0007; }
  .menu .actions { display: flex; gap: 6px; margin-bottom: 6px; }
  .menu .actions button { flex: 1; font-size: 12px; padding: 4px 6px; }
  .menu label { display: flex; align-items: center; gap: 6px; padding: 3px 4px; font-size: 13px; white-space: nowrap; border-radius: 4px; }
  .menu label:hover { background: #2d333b; }
  #main { flex: 1; display: flex; min-height: 0; }
  #canvasWrap { flex: 1; position: relative; overflow: hidden; }
  svg { width: 100%; height: 100%; display: block; cursor: grab; background:
        radial-gradient(circle, #262a30 1px, transparent 1px); background-size: 28px 28px; }
  svg.connecting { cursor: crosshair; }
  #panel { width: 320px; background: #23272e; border-left: 1px solid #333; padding: 14px; overflow-y: auto; font-size: 13px; }
  #panel h3 { margin: 0 0 4px; font-size: 15px; }
  #panel .sub { color: #9aa0a8; font-size: 11px; margin-bottom: 12px; }
  #panel .field { margin-bottom: 10px; }
  #panel .field label { display: block; margin-bottom: 3px; color: #b8bec6; font-size: 12px; }
  #panel input, #panel select { width: 100%; background: #1a1d21; border: 1px solid #4a515a; color: #e6e6e6; border-radius: 4px; padding: 5px 7px; font-size: 13px; }
  #panel .row { display: flex; gap: 8px; }
  #panel .row > * { flex: 1; }
  #panel .checkrow { display: flex; gap: 14px; margin: 10px 0; }
  #panel .checkrow label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; font-size: 13px; }
  .edgeCard { border: 1px solid #3a4048; border-radius: 6px; padding: 8px; margin-bottom: 8px; background: #1e2228; }
  .edgeCard.dead { border-color: #c0392b; }
  .edgeCard .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .edgeCard .top b { font-size: 13px; }
  .edgeCard .del { background: #5a2d2d; border: none; color: #f0b0b0; border-radius: 4px; padding: 2px 8px; cursor: pointer; font-size: 12px; }
  .edgeCard .warn { color: #e88; font-size: 11px; margin-top: 4px; }
  /* 特規邊（目標角色有 evolvePower）：橘紅框 + 徽章，且無關欄位鎖起來防誤改 */
  .edgeCard.special { border-color: #d1442f; background: #241d1b; }
  .edgeCard .sp { background: #d1442f; color: #fff; border-radius: 3px; padding: 1px 6px; font-size: 10px; margin-left: 6px; vertical-align: middle; }
  .edgeCard .spnote { color: #e0916f; font-size: 11px; line-height: 1.5; margin-top: 5px; }
  .edgeCard input:disabled, .edgeCard select:disabled { opacity: .35; cursor: not-allowed; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 50; align-items: center; justify-content: center; }
  .modalBox { background: #23272e; border: 1px solid #4a515a; border-radius: 9px; padding: 16px; width: 460px; max-height: 78vh; overflow-y: auto; box-shadow: 0 10px 40px #000a; }
  .modalBox h3 { margin: 0 0 6px; font-size: 15px; }
  .modalBox input[type=text] { flex: 1; background: #1a1d21; border: 1px solid #4a515a; color: #e6e6e6; border-radius: 4px; padding: 5px 8px; font-size: 13px; }
  .modalBox button { background: #3a4048; color: #e6e6e6; border: 1px solid #4a515a; border-radius: 5px; padding: 5px 11px; cursor: pointer; font-size: 13px; }
  .modalBox button:hover:not(:disabled) { background: #464d57; }
  .modalBox button:disabled { opacity: .35; cursor: default; }
  .tagList { display: flex; flex-direction: column; gap: 4px; }
  .tagRow { display: flex; align-items: center; gap: 6px; background: #1e2228; border: 1px solid #3a4048; border-radius: 5px; padding: 5px 8px; }
  .tagRow .ord { color: #7f868e; font-size: 11px; width: 20px; }
  .tagRow .nm { flex: 1; font-size: 13px; }
  .tagRow .cnt { color: #7f868e; font-size: 11px; margin-right: 4px; }
  .tagRow button { padding: 1px 7px; font-size: 12px; }
  .tagRow button.del { background: #5a2d2d; color: #f0b0b0; border-color: #6d3a3a; }
  .tagbox { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 5px; min-height: 20px; align-items: center; }
  .tag { background: #2f4a63; border: 1px solid #46708f; color: #cfe3f5; border-radius: 10px; padding: 1px 4px 1px 8px; font-size: 12px; display: inline-flex; align-items: center; gap: 4px; }
  .tag b { cursor: pointer; color: #8fb8d8; font-weight: 700; padding: 0 3px; }
  .tag b:hover { color: #ff8a80; }
  .addEdge { margin-top: 8px; }
  .hint { color: #7f868e; font-size: 11px; line-height: 1.5; margin-top: 8px; }
  .legend { position: absolute; bottom: 10px; left: 10px; background: rgba(35,39,46,.9); border: 1px solid #333; border-radius: 6px; padding: 8px 10px; font-size: 11px; line-height: 1.7; }
  .legend .sw { display: inline-block; width: 11px; height: 11px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }
  .node text { pointer-events: none; user-select: none; }
  .empty { color: #7f868e; text-align: center; margin-top: 40px; }
</style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <button onclick="reload()">↻ 重新載入</button>
    <button class="primary" onclick="save()">💾 儲存</button>
    <button id="connectBtn" onclick="toggleConnect()">＋ 連線模式</button>
    <button onclick="autoLayout()">⇄ 自動排版</button>
    <label><input type="checkbox" id="showUnimplanted" checked onchange="render()"> 顯示未實裝</label>
    <div class="dropdown">
      <button id="starterBtn" onclick="toggleStarterMenu(event)">🧬 顯示 starter 鏈 ▾</button>
      <div id="starterMenu" class="menu" style="display:none"></div>
    </div>
    <button onclick="openTagManager()">🏷 標籤管理</button>
    <input type="text" id="search" placeholder="搜尋角色…" oninput="render()">
    <span id="deadBadge"></span>
    <span id="status">載入中…</span>
  </div>
  <div id="main">
    <div id="canvasWrap">
      <svg id="svg"><g id="edgeLayer"></g><g id="nodeLayer"></g><g id="tempLayer"></g></svg>
      <div class="legend">
        <div><span class="sw" style="background:#3d6fb4"></span>Child　<span class="sw" style="background:#3d9b6f"></span>Adult</div>
        <div><span class="sw" style="background:#b88a2d"></span>Perfect　<span class="sw" style="background:#a24bb0"></span>Ultimate</div>
        <div><span class="sw" style="background:#d1442f"></span>Super-Ultimate</div>
        <div><span class="sw" style="background:#c0392b"></span>死路邊　<span class="sw" style="border:1px dashed #888;background:transparent"></span>未實裝　★ starter</div>
      </div>
    </div>
    <div id="panel"><div class="empty">點選節點以編輯<br>或用「連線模式」新增進化邊</div></div>
  </div>
</div>
<div id="tagModal" class="modal" style="display:none">
  <div class="modalBox">
    <h3>🏷 標籤管理</h3>
    <div class="hint" style="margin:0 0 10px">上下箭頭調顯示順序；✎ 改名、× 刪除都會<b>同步套用到所有角色</b>。變更需按「💾 儲存」才寫入。</div>
    <div id="tagList" class="tagList"></div>
    <div class="row" style="display:flex;gap:8px;margin-top:10px">
      <input type="text" id="newTag" placeholder="新增 tag…" onkeydown="if(event.key==='Enter')addTagToRegistry()">
      <button onclick="addTagToRegistry()">加入</button>
    </div>
    <div style="text-align:right;margin-top:12px"><button onclick="closeTagManager()">關閉</button></div>
  </div>
</div>
<script>
// Super-Ultimate = 隱藏第 5 階（目前只有敵方角色，我方進化條件未定）。
// 必須列在 STAGE_ORDER：否則該階節點不會被 autoLayout 定位，且右側 stage 下拉選單
// 找不到對應 option → 顯示成 Child，一存檔就把階級改掉（資料遺失）。
const STAGE_ORDER = ['Child','Adult','Perfect','Ultimate','Super-Ultimate','UnStage'];
const STAGE_COLOR = { Child:'#3d6fb4', Adult:'#3d9b6f', Perfect:'#b88a2d', Ultimate:'#a24bb0', 'Super-Ultimate':'#d1442f', UnStage:'#666' };
const COL_W = 260, NODE_W = 150, NODE_H = 40, ROW_H = 56;

let G = { nodes: [], edges: [] };
let byId = {};
let spriteCache = {};   // id → dataURL（idle_1 縮圖）
let shownStarters = new Set();   // 空 = 顯示全部；否則只顯示這些 starter 可達的鏈
let reachCache = null;           // 目前篩選下可達的 id 集（null = 全部）
let selected = null;      // node id
let suggestions = {}, deadSet = new Set();
let connectMode = false, connectFrom = null;
let view = { x: 0, y: 0, scale: 1 };
let dirty = false;

const svg = document.getElementById('svg');
const edgeLayer = document.getElementById('edgeLayer');
const nodeLayer = document.getElementById('nodeLayer');
const tempLayer = document.getElementById('tempLayer');

function setStatus(t) { document.getElementById('status').textContent = t; }

async function reload() {
  const r = await fetch('/graph'); G = await r.json();
  indexNodes();
  buildStarterMenu();
  // 沒座標的節點自動排版
  if (G.nodes.some(n => n.x == null || n.y == null)) autoLayout(true);
  refreshReach();
  fitView();
  await validate();
  render();
  setStatus(`${G.nodes.length} 角色 / ${G.edges.length} 邊`);
}
function indexNodes() {
  byId = {}; spriteCache = {};
  for (const n of G.nodes) { byId[n.id] = n; if (n.sprite) spriteCache[n.id] = spriteDataURL(n.sprite); }
}

// color-halfblock idle 幀 → dataURL（每格上下兩像素，-1=透明）
function spriteDataURL(sp) {
  try {
    const W = sp.w, H = sp.h * 2;
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');
    const img = ctx.createImageData(W, H);
    for (let cy = 0; cy < sp.cells.length; cy++) {
      const row = sp.cells[cy] || [];
      for (let cx = 0; cx < row.length; cx++) {
        const c = row[cx]; if (!c) continue;
        if (c[0] >= 0) { const o = ((cy*2)*W + cx)*4;   img.data[o]=c[0]; img.data[o+1]=c[1]; img.data[o+2]=c[2]; img.data[o+3]=255; }
        if (c[3] >= 0) { const o = ((cy*2+1)*W + cx)*4; img.data[o]=c[3]; img.data[o+1]=c[4]; img.data[o+2]=c[5]; img.data[o+3]=255; }
      }
    }
    ctx.putImageData(img, 0, 0);
    return cv.toDataURL();
  } catch(e) { return null; }
}

// 送 server 的精簡圖（sprite 不必送，server 從磁碟重讀）
// ⚠️ 這裡是「白名單」：沒列到的欄位存檔時會被靜默丟掉。新增節點屬性時務必同步加進來。
function payload() {
  return {
    nodes: G.nodes.map(n => ({ id:n.id, dir:n.dir, name:n.name, stage:n.stage, power:n.power, starter:n.starter, implanted:n.implanted, weight:n.weight, highTier:n.highTier, tags:n.tags||[], x:n.x, y:n.y })),
    edges: G.edges,
    tagOrder: G.tagOrder || [],
  };
}

function autoLayout(silent) {
  const cols = {};
  STAGE_ORDER.forEach(s => cols[s] = []);
  for (const n of G.nodes) (cols[n.stage] || (cols[n.stage]=[])).push(n);
  STAGE_ORDER.forEach((s, ci) => {
    (cols[s] || []).sort((a,b) => a.power - b.power || a.id.localeCompare(b.id))
      .forEach((n, ri) => { n.x = 40 + ci * COL_W; n.y = 40 + ri * ROW_H; });
  });
  if (!silent) { dirty = true; fitView(); render(); }
}

// ── starter 鏈篩選 ──────────────────────────────────────────────────────
function buildStarterMenu() {
  const m = document.getElementById('starterMenu');
  const starters = G.nodes.filter(n => n.starter).sort((a, b) => a.dir.localeCompare(b.dir));
  m.innerHTML =
    `<div class="actions"><button onclick="allStarters(true)">全選</button>`
    + `<button onclick="allStarters(false)">清除</button></div>`
    + starters.map(s => `<label><input type="checkbox" value="${s.id}" ${shownStarters.has(s.id)?'checked':''} onchange="toggleStarter('${s.id}',this.checked)"> ${s.dir}</label>`).join('');
  updateStarterBtn();
}
function updateStarterBtn() {
  document.getElementById('starterBtn').textContent =
    shownStarters.size ? `🧬 starter 鏈 (${shownStarters.size}) ▾` : '🧬 顯示 starter 鏈 ▾';
}
function toggleStarterMenu(ev) {
  if (ev) ev.stopPropagation();
  const m = document.getElementById('starterMenu');
  m.style.display = m.style.display === 'none' ? 'block' : 'none';
}
function toggleStarter(id, on) { on ? shownStarters.add(id) : shownStarters.delete(id); applyFilter(); }
function allStarters(on) {
  shownStarters = on ? new Set(G.nodes.filter(n => n.starter).map(n => n.id)) : new Set();
  buildStarterMenu(); applyFilter();
}
function applyFilter() { updateStarterBtn(); refreshReach(); fitView(); render(); }
// 收起選單（點別處時）
document.addEventListener('mousedown', ev => {
  const dd = ev.target.closest && ev.target.closest('.dropdown');
  if (!dd) { const m = document.getElementById('starterMenu'); if (m) m.style.display = 'none'; }
});
// 從選定的 starter 沿 evolvesTo 正向 BFS，得可達 id 集（null = 不篩選）
function refreshReach() {
  if (!shownStarters.size) { reachCache = null; return; }
  const adj = {};
  for (const e of G.edges) (adj[e.from] = adj[e.from] || []).push(e.to);
  const seen = new Set(), stack = [...shownStarters];
  while (stack.length) {
    const id = stack.pop(); if (seen.has(id)) continue; seen.add(id);
    for (const t of (adj[id] || [])) if (!seen.has(t)) stack.push(t);
  }
  reachCache = seen;
}

function fitView() {
  if (!G.nodes.length) return;
  const shown = G.nodes.filter(visible);
  const pool = shown.length ? shown : G.nodes;
  const xs = pool.map(n => n.x), ys = pool.map(n => n.y);
  const minX = Math.min(...xs)-40, minY = Math.min(...ys)-40;
  const w = Math.max(...xs)+NODE_W+40 - minX, h = Math.max(...ys)+NODE_H+40 - minY;
  const vw = svg.clientWidth, vh = svg.clientHeight;
  view.scale = Math.min(1, Math.min(vw/w, vh/h));
  view.x = minX; view.y = minY;
  applyView();
}
function applyView() {
  const vw = svg.clientWidth / view.scale, vh = svg.clientHeight / view.scale;
  svg.setAttribute('viewBox', `${view.x} ${view.y} ${vw} ${vh}`);
}

// ── 渲染 ────────────────────────────────────────────────────────────────
function visible(n) {
  if (reachCache && !reachCache.has(n.id)) return false;   // 只顯示選定 starter 鏈
  if (!document.getElementById('showUnimplanted').checked && !n.implanted) return false;
  return true;
}
function render() {
  applyView();
  refreshReach();   // 邊可能在編輯中改變，保持可達集最新
  const q = document.getElementById('search').value.trim().toLowerCase();
  edgeLayer.innerHTML = ''; nodeLayer.innerHTML = '';

  for (const e of G.edges) {
    const a = byId[e.from], b = byId[e.to];
    if (!a || !b || !visible(a) || !visible(b)) continue;
    const x1 = a.x + NODE_W, y1 = a.y + NODE_H/2, x2 = b.x, y2 = b.y + NODE_H/2;
    const mx = (x1+x2)/2;
    const dead = deadSet.has(e.from+'>'+e.to);
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`);
    path.setAttribute('fill','none');
    path.setAttribute('stroke', dead ? '#c0392b' : (e.time ? '#7a6fb0' : '#5a6570'));
    path.setAttribute('stroke-width', dead ? 2.5 : 1.6);
    if (e.time) path.setAttribute('stroke-dasharray','5,3');
    edgeLayer.appendChild(path);
    // pct label
    const pct = e.pct != null ? e.pct : suggestions[e.from+'>'+e.to];
    const lbl = document.createElementNS('http://www.w3.org/2000/svg','text');
    lbl.setAttribute('x', mx); lbl.setAttribute('y', (y1+y2)/2 - 4);
    lbl.setAttribute('text-anchor','middle');
    lbl.setAttribute('font-size','11'); lbl.setAttribute('fill', dead ? '#e88' : '#9aa0a8');
    lbl.textContent = (pct != null ? pct+'%' : '?') + (e.time ? ' '+(e.time==='night'?'🌙':'☀') : '') + (e.pct==null?'*':'');
    edgeLayer.appendChild(lbl);
  }

  for (const n of G.nodes) {
    if (!visible(n)) continue;
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class','node');
    g.setAttribute('transform',`translate(${n.x},${n.y})`);
    const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
    rect.setAttribute('width',NODE_W); rect.setAttribute('height',NODE_H);
    rect.setAttribute('rx',7);
    rect.setAttribute('fill', STAGE_COLOR[n.stage] || '#666');
    rect.setAttribute('fill-opacity', n.implanted ? 0.92 : 0.28);
    const hit = q && n.id.includes(q);
    rect.setAttribute('stroke', selected===n.id ? '#fff' : (hit ? '#ffd54a' : (n.implanted ? '#0006' : '#888')));
    rect.setAttribute('stroke-width', selected===n.id ? 3 : (hit ? 3 : 1.5));
    if (!n.implanted) rect.setAttribute('stroke-dasharray','4,3');
    g.appendChild(rect);
    // idle_1 縮圖（左側）
    const tx = spriteCache[n.id] ? 40 : 10;
    if (spriteCache[n.id]) {
      const im = document.createElementNS('http://www.w3.org/2000/svg','image');
      im.setAttribute('x', 5); im.setAttribute('y', (NODE_H-30)/2);
      im.setAttribute('width', 30); im.setAttribute('height', 30);
      im.setAttribute('preserveAspectRatio','xMidYMid meet');
      im.setAttribute('href', spriteCache[n.id]);
      im.setAttribute('style','image-rendering:pixelated');
      if (!n.implanted) im.setAttribute('opacity','0.5');
      g.appendChild(im);
    }
    const t = document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x', tx); t.setAttribute('y', NODE_H/2 - 2);
    t.setAttribute('font-size','13'); t.setAttribute('fill','#fff'); t.setAttribute('font-weight','600');
    t.textContent = (n.starter?'★ ':'') + n.dir;
    g.appendChild(t);
    const p = document.createElementNS('http://www.w3.org/2000/svg','text');
    p.setAttribute('x', tx); p.setAttribute('y', NODE_H/2 + 13);
    p.setAttribute('font-size','10'); p.setAttribute('fill','#ffffffcc');
    p.textContent = `${n.stage} · pow ${n.power}`;
    g.appendChild(p);
    g.addEventListener('mousedown', ev => onNodeDown(ev, n));
    nodeLayer.appendChild(g);
  }
  document.getElementById('connectBtn').classList.toggle('active', connectMode);
  svg.classList.toggle('connecting', connectMode);
  updateDeadBadge();
}

function updateDeadBadge() {
  const b = document.getElementById('deadBadge');
  if (deadSet.size) { b.classList.add('show'); b.textContent = `⚠ ${deadSet.size} 條死路`; }
  else b.classList.remove('show');
}

// ── 驗證 ────────────────────────────────────────────────────────────────
let valTimer = null;
function scheduleValidate() { clearTimeout(valTimer); valTimer = setTimeout(validate, 250); }
async function validate() {
  try {
    const r = await fetch('/validate', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload()) });
    const d = await r.json();
    suggestions = d.suggestions || {};
    deadSet = new Set((d.dead||[]).map(x => x.from+'>'+x.strongTgt));
    render();
    if (selected) openPanel(selected);
  } catch(e) { setStatus('驗證失敗: '+e.message); }
}

// ── 節點拖拉 / 連線 / 選取 ──────────────────────────────────────────────
let drag = null;
function onNodeDown(ev, n) {
  ev.stopPropagation();
  if (connectMode) {
    if (!connectFrom) { connectFrom = n.id; setStatus(`連線：從 ${n.dir} → 點目標`); render(); }
    else { addEdge(connectFrom, n.id); connectFrom = null; }
    return;
  }
  const pt = toSvg(ev);
  drag = { id: n.id, dx: pt.x - n.x, dy: pt.y - n.y, moved: false };
}
window.addEventListener('mousemove', ev => {
  if (drag) {
    const pt = toSvg(ev); const n = byId[drag.id];
    n.x = pt.x - drag.dx; n.y = pt.y - drag.dy; drag.moved = true; dirty = true;
    render();
  } else if (pan) {
    view.x = pan.vx - (ev.clientX - pan.sx)/view.scale;
    view.y = pan.vy - (ev.clientY - pan.sy)/view.scale;
    applyView();
  }
});
window.addEventListener('mouseup', ev => {
  if (drag && !drag.moved) select(drag.id);
  drag = null; pan = null;
});
let pan = null;
svg.addEventListener('mousedown', ev => {
  if (connectMode) { connectFrom = null; setStatus('連線模式：點來源節點'); return; }
  pan = { sx: ev.clientX, sy: ev.clientY, vx: view.x, vy: view.y };
});
svg.addEventListener('wheel', ev => {
  ev.preventDefault();
  const pt = toSvg(ev);
  const f = ev.deltaY < 0 ? 1.12 : 1/1.12;
  view.scale = Math.max(0.15, Math.min(3, view.scale * f));
  const pt2 = toSvg(ev);
  view.x += pt.x - pt2.x; view.y += pt.y - pt2.y;
  applyView(); render();
}, { passive:false });

function toSvg(ev) {
  const r = svg.getBoundingClientRect();
  return { x: view.x + (ev.clientX - r.left)/view.scale, y: view.y + (ev.clientY - r.top)/view.scale };
}
function select(id) { selected = id; render(); openPanel(id); }
function toggleConnect() { connectMode = !connectMode; connectFrom = null; setStatus(connectMode?'連線模式：點來源節點':'已離開連線模式'); render(); }

function addEdge(from, to) {
  if (from === to) { setStatus('不能連自己'); return; }
  if (G.edges.some(e => e.from===from && e.to===to)) { setStatus('這條邊已存在'); return; }
  G.edges.push({ from, to, pct:null, cost:null, minBattles:null, time:null });
  dirty = true; setStatus(`新增邊 ${byId[from].dir}→${byId[to].dir}`);
  scheduleValidate();
}
function removeEdge(from, to) {
  G.edges = G.edges.filter(e => !(e.from===from && e.to===to));
  dirty = true; scheduleValidate();
}

// ── 右側面板 ────────────────────────────────────────────────────────────
function openPanel(id) {
  const n = byId[id]; if (!n) return;
  const outEdges = G.edges.filter(e => e.from === id);
  const inEdges = G.edges.filter(e => e.to === id);
  const targets = G.nodes.filter(m => m.id!==id && !outEdges.some(e=>e.to===m.id))
    .sort((a,b)=>a.power-b.power);
  const p = document.getElementById('panel');
  p.innerHTML = `
    <h3>${n.dir}</h3>
    <div class="sub">id: ${n.id}　被進化來源: ${inEdges.map(e=>byId[e.from]?.dir||e.from).join(', ')||'—'}</div>
    <div class="row">
      <div class="field"><label>階段 stage</label>
        <select onchange="upd('${id}','stage',this.value)">
          ${STAGE_ORDER.map(s=>`<option ${s===n.stage?'selected':''}>${s}</option>`).join('')}
        </select></div>
      <div class="field"><label>戰力 power</label>
        <input type="number" value="${n.power}" onchange="upd('${id}','power',+this.value)"></div>
    </div>
    <div class="checkrow">
      <label><input type="checkbox" ${n.implanted?'checked':''} onchange="upd('${id}','implanted',this.checked)"> 實裝 (roster)</label>
      <label><input type="checkbox" ${n.starter?'checked':''} onchange="upd('${id}','starter',this.checked)"> starter</label>
    </div>
    ${n.starter ? `<div class="row" style="align-items:flex-end">
      <div class="field"><label>reset 抽選權重</label>
        <input type="number" min="0" step="0.5" value="${n.weight ?? 1}" onchange="upd('${id}','weight',this.value===''?1:+this.value)"></div>
      <div class="field"><label>&nbsp;</label>
        <label style="display:flex;align-items:center;gap:5px;height:29px"><input type="checkbox" ${n.highTier?'checked':''} onchange="upd('${id}','highTier',this.checked)"> 高階(reset 用 dust_hi)</label></div>
    </div>` : ''}
    <div class="field"><label>標籤 tags <span class="hint" style="font-weight:400">（內部分類，不對玩家顯示）</span></label>
      <div id="tagChips" class="tagbox">
        ${(n.tags||[]).map(t=>`<span class="tag">${t}<b onclick="rmTag('${id}','${t}')" title="移除">×</b></span>`).join('') || '<span class="hint">（無）</span>'}
      </div>
      <input id="tagInput" list="allTags" placeholder="輸入或選既有 tag，Enter 加入"
             onkeydown="if(event.key==='Enter'){addTag('${id}',this.value);this.value='';}">
      <datalist id="allTags">${allTags().map(t=>`<option value="${t}">`).join('')}</datalist>
    </div>
    <div class="field"><label>進化到 (evolvesTo)</label></div>
    ${outEdges.map(e=>edgeCardHtml(id,e)).join('') || '<div class="hint">（無 — 終點角色）</div>'}
    <div class="addEdge field">
      <label>＋ 新增進化到</label>
      <select id="addTgt">
        <option value="">選目標…</option>
        ${targets.map(m=>`<option value="${m.id}">${m.dir} (pow ${m.power}${m.implanted?'':' ·未實裝'})</option>`).join('')}
      </select>
      <button style="margin-top:6px;width:100%" onclick="const v=document.getElementById('addTgt').value; if(v) addEdge('${id}',v)">加入</button>
    </div>
    <div class="hint">win% 顯示 <b>*</b> = 未手填、用公式建議值。留空存檔時自動帶入建議值。<br>紅框 = 死路（目標 power 較高但 win% 沒較高，取強者時永遠選不到）。</div>
  `;
}
function edgeCardHtml(from, e) {
  const t = byId[e.to];
  const dead = deadSet.has(from+'>'+e.to);
  const sug = suggestions[from+'>'+e.to];
  // 特規邊＝目標角色有 evolvePower（進化後戰力固定、不繼承）。這類線只吃 win%/minBattles/戰力，
  // 其餘欄位一律鎖住：花費對彩蛋線沒意義（設 0 只是因為 save 一定會 emit 一條 cost_threshold），
  // 日夜/tag 沒用到，開放編輯只會讓人誤填而讓彩蛋觸發不了。
  const sp   = t && t.evolvePower != null ? t.evolvePower : null;
  const lock = sp != null ? 'disabled' : '';
  return `<div class="edgeCard ${dead?'dead':''} ${sp!=null?'special':''}">
    <div class="top"><b>→ ${t?t.dir:e.to}${sp!=null?'<span class="sp">特規</span>':''}</b><button class="del" onclick="removeEdge('${from}','${e.to}')">刪除</button></div>
    <div class="row">
      <div class="field"><label>win% ${e.pct==null?`(建議 ${sug??'?'})`:''}</label>
        <input type="number" placeholder="${sug??''}" value="${e.pct==null?'':e.pct}" onchange="updEdge('${from}','${e.to}','pct',this.value===''?null:+this.value)"></div>
      <div class="field"><label>花費 usd</label>
        <input type="number" placeholder="stage 預設" value="${e.cost==null?'':e.cost}" ${lock}
               onchange="updEdge('${from}','${e.to}','cost',this.value===''?null:+this.value)"></div>
    </div>
    <div class="row">
      <div class="field"><label>minBattles</label>
        <input type="number" placeholder="stage 預設" value="${e.minBattles==null?'':e.minBattles}" onchange="updEdge('${from}','${e.to}','minBattles',this.value===''?null:+this.value)"></div>
      <div class="field"><label>日夜 time</label>
        <select ${lock} onchange="updEdge('${from}','${e.to}','time',this.value||null)">
          <option value="" ${!e.time?'selected':''}>—</option>
          <option value="day" ${e.time==='day'?'selected':''}>☀ 日</option>
          <option value="night" ${e.time==='night'?'selected':''}>🌙 夜</option>
        </select></div>
      <div class="field"><label>戰力 ≥</label>
        <input type="number" min="0" placeholder="不限" value="${e.power==null?'':e.power}"
               onchange="updEdge('${from}','${e.to}','power',this.value===''?null:+this.value)"></div>
    </div>
    <div class="row">
      <div class="field"><label>tag 交戰</label>
        <select ${lock} onchange="updEdge('${from}','${e.to}','tag',this.value||null)">
          <option value="" ${!e.tag?'selected':''}>—</option>
          ${allTags().map(t=>`<option value="${t}" ${e.tag===t?'selected':''}>${t}</option>`).join('')}
        </select></div>
      <div class="field"><label>次數 ≥</label>
        <input type="number" min="1" placeholder="1" value="${e.tagCount==null?'':e.tagCount}" ${e.tag&&sp==null?'':'disabled'}
               onchange="updEdge('${from}','${e.to}','tagCount',this.value===''?null:+this.value)"></div>
      <div class="field"><label>該 tag 勝率%</label>
        <input type="number" min="0" max="100" placeholder="不限" value="${e.tagPct==null?'':e.tagPct}" ${e.tag&&sp==null?'':'disabled'}
               onchange="updEdge('${from}','${e.to}','tagPct',this.value===''?null:+this.value)"></div>
    </div>
    ${sp!=null?`<div class="spnote">🥚 <b>特規隱藏線</b>：進化後戰力固定 <b>${sp}</b>（不繼承原戰力）${t.stage==='Super-Ultimate'?'，上限 210；卡片階級顯示 Ultimate，vpet tree 依實際血緣長度縮短':''}。<br>只吃 <b>win% / minBattles / 戰力 ≥</b>，其餘欄位已鎖以免誤填讓彩蛋觸發不了。固定戰力要改請直接編 <code>${t.dir}/config.json</code> 的 <code>evolvePower</code>。</div>`:''}
    <div class="row">
      <div class="field"><label>統計 key</label>
        <input type="text" placeholder="如 petRefuse" value="${e.statKey||''}" style="min-width:0"
               onchange="updEdge('${from}','${e.to}','statKey',this.value.trim()||null)"></div>
      <div class="field"><label>次數 &ge;</label>
        <input type="number" min="1" placeholder="1" value="${e.statCount==null?'':e.statCount}" ${e.statKey?'':'disabled'}
               onchange="updEdge('${from}','${e.to}','statCount',this.value===''?null:+this.value)"></div>
      <div class="field"><label>範圍</label>
        <select ${e.statKey?'':'disabled'} onchange="updEdge('${from}','${e.to}','statScope',this.value||null)">
          <option value="" ${e.statScope!=='life'?'selected':''}>本階段</option>
          <option value="life" ${e.statScope==='life'?'selected':''}>本輪</option>
        </select></div>
    </div>
    <div class="row">
      <div class="field"><label>經過時間</label>
        <select onchange="updEdge('${from}','${e.to}','elapsedSince',this.value||null)">
          <option value="" ${!e.elapsedSince?'selected':''}>—</option>
          <option value="birth" ${e.elapsedSince==='birth'?'selected':''}>自出生</option>
          <option value="evolve" ${e.elapsedSince==='evolve'?'selected':''}>自上次進化</option>
        </select></div>
      <div class="field"><label>秒數 &ge;</label>
        <input type="number" min="0" placeholder="秒" value="${e.elapsedSec==null?'':e.elapsedSec}" ${e.elapsedSince?'':'disabled'}
               onchange="updEdge('${from}','${e.to}','elapsedSec',this.value===''?null:+this.value)"></div>
    </div>
    ${e.statKey?`<div class="hint" style="margin-top:2px">隱藏統計「${e.statKey}」需 &ge; ${e.statCount??1}（${e.statScope==='life'?'本輪，reset 才歸零':'本階段，進化即歸零'}）— <code>vpet stats</code> 可查</div>`:''}
    ${e.elapsedSince?`<div class="hint" style="margin-top:2px">距離${e.elapsedSince==='birth'?'出生':'上次進化'}需 &ge; ${e.elapsedSec??0} 秒（約 ${((e.elapsedSec||0)/3600).toFixed(1)} 小時）</div>`:''}
    ${e.tag&&sp==null?`<div class="hint" style="margin-top:2px">與帶「${e.tag}」的對手交戰 ≥ ${e.tagCount??1} 次${e.tagPct!=null?`，且對該 tag 勝率 ≥ ${e.tagPct}%`:''}（敗場也算交戰；進化後歸零）</div>`:''}
    ${e.power!=null?`<div class="hint" style="margin-top:2px">當前戰力（base + 訓練值）需 ≥ ${e.power}；填本階 cap＝練滿才給進</div>`:''}
    ${dead?'<div class="warn">⚠ 死路：調高此邊 win% 或降低較弱分支</div>':''}
  </div>`;
}
// ── tags：內部分類標籤 ───────────────────────────────────────────────────
// 候選清單＝全庫既有 tag 的聯集（不另開登錄檔）。用 datalist 給既有值，
// 避免 dragon / Dragon / drgaon 這種拼字漂移讓日後的 tag 條件靜默失效。
// 顯示順序＝登錄檔 tags.json 的順序；未登錄的（手改 config 加的）排在後面、字母序。
function allTags() {
  const order = G.tagOrder || [];
  const s = new Set(order);
  for (const n of G.nodes) for (const t of (n.tags || [])) s.add(t);
  return [...s].sort(tagCmp);
}
function tagCmp(a, b) {
  const order = G.tagOrder || [];
  const ia = order.indexOf(a), ib = order.indexOf(b);
  if (ia !== -1 && ib !== -1) return ia - ib;      // 都登錄 → 照登錄順序
  if (ia !== -1) return -1;                        // 已登錄的排前面
  if (ib !== -1) return 1;
  return a.localeCompare(b);                       // 都未登錄 → 字母序
}
function tagUsage(t) { return G.nodes.filter(n => (n.tags || []).includes(t)).length; }

// ── tag 管理面板：新增／改名／刪除／排序 ─────────────────────────────────
// 改名與刪除會「同步套用到所有角色」——這是登錄檔真正的價值（可一次修掉全庫拼字錯誤）。
// 所有變更只改記憶體，跟其他編輯一樣要按 💾 儲存才寫檔。
function openTagManager() {
  G.tagOrder = G.tagOrder || [];
  for (const t of allTags()) if (!G.tagOrder.includes(t)) G.tagOrder.push(t);  // 未登錄的先收編
  renderTagManager();
  document.getElementById('tagModal').style.display = 'flex';
}
function closeTagManager() { document.getElementById('tagModal').style.display = 'none'; render(); if (selected) openPanel(selected); }
function renderTagManager() {
  const list = G.tagOrder || [];
  document.getElementById('tagList').innerHTML = list.length ? list.map((t, i) => `
    <div class="tagRow">
      <span class="ord">${i + 1}</span>
      <span class="nm">${t}</span>
      <span class="cnt">${tagUsage(t)} 隻</span>
      <button onclick="moveTag(${i},-1)" ${i === 0 ? 'disabled' : ''} title="上移">↑</button>
      <button onclick="moveTag(${i},1)" ${i === list.length - 1 ? 'disabled' : ''} title="下移">↓</button>
      <button onclick="renameTag('${t}')" title="改名（套用到所有角色）">✎</button>
      <button class="del" onclick="deleteTag('${t}')" title="刪除（從所有角色移除）">×</button>
    </div>`).join('') : '<div class="hint">（尚無 tag。下方可新增，或在角色面板直接輸入。）</div>';
}
function moveTag(i, d) {
  const a = G.tagOrder, j = i + d;
  if (j < 0 || j >= a.length) return;
  [a[i], a[j]] = [a[j], a[i]];
  dirty = true; renderTagManager();
}
function addTagToRegistry() {
  const el = document.getElementById('newTag');
  const t = String(el.value || '').trim();
  if (!t) return;
  G.tagOrder = G.tagOrder || [];
  if (G.tagOrder.includes(t)) { setStatus(`已存在：${t}`); return; }
  G.tagOrder.push(t); el.value = '';
  dirty = true; renderTagManager(); setStatus(`新增 tag：${t}`);
}
function renameTag(oldName) {
  const t = String(prompt(`把「${oldName}」改名為：（會同步套用到 ${tagUsage(oldName)} 隻角色）`, oldName) || '').trim();
  if (!t || t === oldName) return;
  const merging = G.tagOrder.includes(t);
  if (merging && !confirm(`「${t}」已存在 → 會把兩者合併。確定？`)) return;
  for (const n of G.nodes) {
    if (!(n.tags || []).includes(oldName)) continue;
    n.tags = [...new Set(n.tags.map(x => x === oldName ? t : x))].sort(tagCmp);
  }
  const i = G.tagOrder.indexOf(oldName);
  if (merging) G.tagOrder.splice(i, 1); else G.tagOrder[i] = t;
  dirty = true; renderTagManager(); setStatus(`改名：${oldName} → ${t}`);
}
function deleteTag(t) {
  const used = tagUsage(t);
  if (used && !confirm(`「${t}」目前有 ${used} 隻角色在用，刪除會一併從牠們身上移除。確定？`)) return;
  for (const n of G.nodes) if ((n.tags || []).includes(t)) n.tags = n.tags.filter(x => x !== t);
  G.tagOrder = G.tagOrder.filter(x => x !== t);
  dirty = true; renderTagManager(); setStatus(`刪除 tag：${t}`);
}
function addTag(id, raw) {
  const t = String(raw || '').trim();
  if (!t) return;
  const n = byId[id];
  n.tags = n.tags || [];
  if (n.tags.includes(t)) { setStatus(`已有 tag：${t}`); return; }
  n.tags.push(t); n.tags.sort(tagCmp);
  G.tagOrder = G.tagOrder || [];
  if (!G.tagOrder.includes(t)) G.tagOrder.push(t);   // 新 tag 自動登錄（排最後，可到管理面板調）
  dirty = true; openPanel(id); setStatus(`加上 tag：${t}`);
}
function rmTag(id, t) {
  const n = byId[id];
  n.tags = (n.tags || []).filter(x => x !== t);
  dirty = true; openPanel(id); setStatus(`移除 tag：${t}`);
}

function upd(id, key, val) {
  byId[id][key] = val; dirty = true;
  if (selected === id) openPanel(id);   // starter/高階 等結構變動即時反映面板
  scheduleValidate();
}
function updEdge(from, to, key, val) {
  const e = G.edges.find(x=>x.from===from && x.to===to); if (!e) return;
  e[key] = val; dirty = true; scheduleValidate();
}

// ── 儲存 ────────────────────────────────────────────────────────────────
async function save() {
  setStatus('儲存中…');
  try {
    const r = await fetch('/save', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload()) });
    const d = await r.json();
    if (!d.ok) { setStatus('儲存失敗: '+d.error); return; }
    dirty = false;
    let msg = `✅ 已寫入 ${d.written} 角色 · roster ${d.roster} · starters ${d.starters}`;
    if (d.dead && d.dead.length) msg += ` · ⚠ ${d.dead.length} 死路`;
    if (d.deployErrors && d.deployErrors.length) msg += ` · 部署錯誤 ${d.deployErrors.length}`;
    setStatus(msg);
  } catch(e) { setStatus('儲存失敗: '+e.message); }
}

window.addEventListener('keydown', ev => {
  if ((ev.ctrlKey||ev.metaKey) && ev.key==='s') { ev.preventDefault(); save(); }
});
window.addEventListener('beforeunload', ev => { if (dirty) { ev.preventDefault(); ev.returnValue=''; } });
window.addEventListener('resize', () => { applyView(); });

reload();
</script>
</body>
