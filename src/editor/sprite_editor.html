<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>Sprite Editor</title>
<style>
:root {
  --bg: #1e1e1e;
  --fg: #e0e0e0;
  --accent: #4da3ff;
  --panel: #2a2a2a;
  --border: #444;
  --danger: #ff5555;
  --ok: #50c878;
  --cell-px: 28px;
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 20px;
  background: var(--bg); color: var(--fg);
  font-family: -apple-system, "Segoe UI", sans-serif;
  font-size: 14px;
}
h1 { margin: 0 0 16px; font-size: 18px; }
.mode-toggle { display: inline-flex; gap: 4px; margin-left: 16px; vertical-align: middle; }
.mode-toggle button {
  background: #3a3a3a; color: #aaa; border: 1px solid var(--border);
  padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: 12px;
}
.mode-toggle button.active { background: var(--accent); color: white; border-color: var(--accent); }
.mode-toggle button:hover { filter: brightness(1.15); }
.layout {
  display: grid;
  grid-template-columns: auto 1fr 240px;
  gap: 20px;
  align-items: start;
}
.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px;
}
.panel h3 { margin: 0 0 10px; font-size: 13px; color: var(--accent); }

/* 左側：12 幀縮圖 */
.thumbs { display: flex; flex-direction: column; gap: 6px; }
.thumb {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 8px; border-radius: 6px;
  cursor: pointer; border: 2px solid transparent;
}
.thumb:hover { background: #333; }
.thumb.active { border-color: var(--accent); background: #2d3a4a; }
.thumb canvas { image-rendering: pixelated; height: 48px; background: #1a1a1a; /* width 由 JS 按 W/H 比例設定 */ }
.thumb span { font-size: 12px; color: #bbb; }

/* 中間：編輯區 */
.editor-wrap { display: flex; flex-direction: column; gap: 12px; }
.canvas-row { display: flex; gap: 16px; }
#editor {
  display: grid;
  /* grid-template-columns/rows 由 JS 動態設定（不同模式 W/H 不同） */
  gap: 1px;
  background: #222;
  padding: 1px;
  border: 2px solid var(--border);
  image-rendering: pixelated;
  cursor: crosshair;
  position: relative;
}
#editor.tool-select { cursor: cell; }
#selection-overlay {
  position: absolute;
  border: 2px dashed var(--accent);
  box-shadow: 0 0 0 1px rgba(0,0,0,0.6) inset;
  pointer-events: none;
  z-index: 5;
  display: none;
}
.tool-toggle { display: inline-flex; gap: 4px; margin-left: 12px; vertical-align: middle; }
.tool-toggle button {
  background: #3a3a3a; color: #aaa; border: 1px solid var(--border);
  padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: 12px;
}
.tool-toggle button.active { background: var(--ok); color: white; border-color: var(--ok); }
.tool-toggle button:hover { filter: brightness(1.15); }
#editor .cell {
  width: var(--cell-px); height: var(--cell-px);
  position: relative;
}
#editor .cell.transparent::before {
  content: "";
  position: absolute; inset: 0;
  background:
    linear-gradient(45deg, #333 25%, transparent 25%),
    linear-gradient(-45deg, #333 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #333 75%),
    linear-gradient(-45deg, transparent 75%, #333 75%);
  background-size: 14px 14px;
  background-position: 0 0, 0 7px, 7px -7px, -7px 0;
}
#preview {
  image-rendering: pixelated;
  /* width/height 由 JS 按 W/H 設定 */
  background: #1a1a1a;
  border: 1px solid var(--border);
  align-self: start;
}

/* 右側：工具 */
.palette {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
  margin-bottom: 10px;
}
.swatch {
  aspect-ratio: 1;
  border: 2px solid var(--border);
  cursor: pointer; border-radius: 4px;
  position: relative;
}
.swatch.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.swatch.transparent {
  background:
    linear-gradient(45deg, #333 25%, transparent 25%),
    linear-gradient(-45deg, #333 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #333 75%),
    linear-gradient(-45deg, transparent 75%, #333 75%);
  background-size: 10px 10px;
  background-position: 0 0, 0 5px, 5px -5px, -5px 0;
}
.controls button {
  width: 100%;
  padding: 8px;
  background: var(--accent);
  color: white; border: none; border-radius: 6px;
  font-size: 13px; font-weight: bold;
  cursor: pointer; margin-bottom: 8px;
}
.controls button:hover { filter: brightness(1.1); }
.controls button.secondary { background: #555; }
.controls button.danger { background: var(--danger); }
.info { font-size: 12px; color: #aaa; line-height: 1.5; }
.hotkeys { font-size: 11px; color: #888; margin-top: 8px; }
.hotkeys code { background: #111; padding: 1px 5px; border-radius: 3px; }
#status { margin-top: 10px; padding: 8px; border-radius: 4px; font-size: 12px; display: none; white-space: pre-line; }
#status.ok { background: #1d4d33; color: #aaffcc; display: block; }
#status.err { background: #4d1d1d; color: #ffaaaa; display: block; }
.color-picker-row { display: flex; gap: 6px; margin-top: 8px; align-items: center; }
.color-picker-row input[type="color"] { width: 40px; height: 32px; border: 1px solid var(--border); background: transparent; }
.color-picker-row button { flex: 1; font-size: 12px; padding: 5px; }

/* 顏色取代浮動選單 */
.replace-menu {
  position: fixed;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px;
  z-index: 100;
  box-shadow: 0 4px 14px rgba(0,0,0,0.6);
  display: none;
}
.replace-menu.open { display: block; }
.replace-menu-header { font-size: 12px; margin-bottom: 8px; color: #ccc; display: flex; align-items: center; gap: 6px; }
.replace-menu-header .from-swatch {
  display: inline-block; width: 16px; height: 16px;
  border: 1px solid #666; border-radius: 3px;
}
.replace-menu-header .from-swatch.transparent {
  background:
    linear-gradient(45deg, #333 25%, transparent 25%),
    linear-gradient(-45deg, #333 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #333 75%),
    linear-gradient(-45deg, transparent 75%, #333 75%);
  background-size: 8px 8px;
  background-position: 0 0, 0 4px, 4px -4px, -4px 0;
}
.replace-menu-grid {
  display: grid;
  grid-template-columns: repeat(6, 24px);
  gap: 4px;
}
.replace-menu .swatch {
  width: 24px; height: 24px;
  border: 1px solid var(--border);
  border-radius: 3px; cursor: pointer;
  position: relative;
}
.replace-menu .swatch:hover { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.replace-menu .swatch.transparent {
  background:
    linear-gradient(45deg, #333 25%, transparent 25%),
    linear-gradient(-45deg, #333 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #333 75%),
    linear-gradient(-45deg, transparent 75%, #333 75%);
  background-size: 10px 10px;
  background-position: 0 0, 0 5px, 5px -5px, -5px 0;
}
</style>
</head>
<body>
<h1>
  <span id="editor-title">🦖 Sprite Editor</span>
  <span class="mode-toggle">
    <button id="mode-character" class="active" onclick="switchMode('character')">🦖 角色</button>
    <button id="mode-bullet" onclick="switchMode('bullet')">💥 子彈</button>
    <button id="mode-shared" onclick="switchMode('shared')">🌐 共用</button>
    <button id="mode-cutin" onclick="switchMode('cutin')">✨ CutIn</button>
  </span>
  <span class="tool-toggle">
    <button id="tool-paint" class="active" onclick="setTool('paint')">✏️ 畫筆</button>
    <button id="tool-select" onclick="setTool('select')">⬚ 選取</button>
  </span>
</h1>

<div class="layout">
  <!-- 左側：幀縮圖 -->
  <div class="panel thumbs" id="thumbs"></div>

  <!-- 中間：編輯區 -->
  <div class="editor-wrap">
    <div class="panel">
      <h3>編輯中：<span id="frame-title">Frame 0</span></h3>
      <div class="canvas-row">
        <div id="editor"><div id="selection-overlay"></div></div>
        <div>
          <div style="font-size:12px;color:#999;margin-bottom:4px;">8× 預覽</div>
          <canvas id="preview" width="16" height="16"></canvas>
        </div>
      </div>
    </div>
  </div>

  <!-- 右側：工具 -->
  <div class="panel">
    <h3>調色盤</h3>
    <div class="palette" id="palette"></div>

    <div class="color-picker-row">
      <input type="color" id="customColor" value="#ffff00">
      <button class="secondary" id="addColor">加入色盤</button>
    </div>

    <h3 style="margin-top:16px;">操作</h3>
    <div class="controls">
      <button id="save">儲存 (Ctrl+S)</button>
      <button class="secondary" id="undo">復原 (Ctrl+Z)</button>
      <button class="secondary" id="reload">重新載入</button>
    </div>

    <div class="hotkeys">
      <b>畫筆：</b><br>
      <code>左鍵</code> 塗色　<code>右鍵</code> 透明<br>
      <code>Alt+點</code> 取色<br>
      <b style="display:inline-block;margin-top:4px;">選取：</b><br>
      <code>框外拖</code> 畫選區<br>
      <code>框內拖</code> 移動像素<br>
      <code>Esc</code> 取消選取<br>
      <b style="display:inline-block;margin-top:4px;">調色盤：</b><br>
      <code>左鍵</code> 選色　<code>右鍵</code> 取代為...<br>
      <b style="display:inline-block;margin-top:4px;">通用：</b><br>
      <code>B / V</code> 畫筆 / 選取<br>
      <code>[ ]</code> 切換上/下幀<br>
      <code>Ctrl+Z</code> 復原　<code>Ctrl+S</code> 儲存
    </div>

    <div id="status"></div>
  </div>
</div>

<!-- 顏色取代浮動選單（右鍵調色盤色塊觸發）-->
<div class="replace-menu" id="replace-menu">
  <div class="replace-menu-header">
    取代 <span class="from-swatch" id="replace-from"></span> → 點選目標色（本幀）
  </div>
  <div class="replace-menu-grid" id="replace-targets"></div>
</div>

<script>
let FRAME_NAMES = ['Idle_1','Idle_2','Eat_1','Eat_2','Sleep_1','Sleep_2','Refuse','Happy','Angry','Hurt','Sad','Attack'];
let RIGHT_OFFSET = null; // null = 全部翻轉；數字 = 右向幀起始 index
let W = 16, H = 16;       // 隨 data 動態（character/bullet 16x16；cutin 32x16）

let data = null;
let currentFrame = 0;
let currentColor = [0, 0, 0]; // null = transparent
let currentIsTransparent = false;
let palette = [];
let history = []; // 復原堆疊
let isDragging = false;
let currentMode = 'character'; // 'character' | 'bullet' | 'shared' | 'cutin'
let currentTool = 'paint';     // 'paint' | 'select'
let sel = null;                // { x0, y0, x1, y1 } 包含上下界
let dragState = null;          // { mode: 'define', x0, y0 } | { mode: 'move', lifted, baseSel, anchorX, anchorY, dx, dy }

let CELL_PX = 28;
const GAP_PX = 1, PAD_PX = 1;

function applyDimensions() {
    // cell 大小：寬幀（cutin 32）縮小避免畫面太寬
    CELL_PX = Math.min(28, Math.floor(600 / Math.max(W, H)));
    document.documentElement.style.setProperty('--cell-px', CELL_PX + 'px');
    const editor = document.getElementById('editor');
    editor.style.gridTemplateColumns = `repeat(${W}, ${CELL_PX}px)`;
    editor.style.gridTemplateRows    = `repeat(${H}, ${CELL_PX}px)`;
    // preview：8× scale 維持比例
    const prev = document.getElementById('preview');
    prev.width = W; prev.height = H;
    prev.style.width  = (W * 8) + 'px';
    prev.style.height = (H * 8) + 'px';
}
function cellOriginToPx(cx, cy) {
    return { left: PAD_PX + cx * (CELL_PX + GAP_PX), top: PAD_PX + cy * (CELL_PX + GAP_PX) };
}
function normalizeBox(a, b, c, d) {
    return { x0: Math.min(a, c), y0: Math.min(b, d), x1: Math.max(a, c), y1: Math.max(b, d) };
}
function isInSel(x, y) { return sel && x >= sel.x0 && x <= sel.x1 && y >= sel.y0 && y <= sel.y1; }

function frameLabel(i) {
    if (RIGHT_OFFSET != null && i >= RIGHT_OFFSET) {
        return FRAME_NAMES[i - RIGHT_OFFSET] + ' →';
    }
    return FRAME_NAMES[i] ?? `Frame ${i}`;
}

// ── 工具函式 ────────────────────────────────
const rgbStr = c => c ? `rgb(${c[0]},${c[1]},${c[2]})` : 'transparent';
const rgbHex = c => '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');
const hexRgb = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
const pxEqual = (a, b) => !a && !b || (a && b && a[0]===b[0] && a[1]===b[1] && a[2]===b[2]);

// ── 初始化 ──────────────────────────────────
async function load() {
    let charName = '';
    RIGHT_OFFSET = null;
    try {
        const metaRes = await fetch('/meta?mode=' + currentMode);
        if (metaRes.ok) {
            const meta = await metaRes.json();
            charName = meta.name;
            if (meta.frameNames) FRAME_NAMES = meta.frameNames;
            if (meta.rightOffset != null) RIGHT_OFFSET = meta.rightOffset;
        }
    } catch(e) {}

    const dataRes = await fetch('/data?mode=' + currentMode);
    if (!dataRes.ok) {
        document.getElementById('status').className = 'err';
        document.getElementById('status').textContent = '✗ 載入失敗：' + currentMode;
        return;
    }
    data = await dataRes.json();
    history = []; // 切換模式時清空 undo 堆疊

    // 從 data 抓尺寸（cutin 是 32×16，其他 16×16）
    W = data.width  || 16;
    H = data.height || 16;
    applyDimensions();

    if (charName) {
        document.title = `${charName} - Sprite Editor [${currentMode}]`;
        const icon  = currentMode === 'bullet' ? '💥' : currentMode === 'shared' ? '🌐' : currentMode === 'cutin' ? '✨' : '🦖';
        const label = currentMode === 'bullet' ? '子彈' : currentMode === 'shared' ? '共用 sprite' : currentMode === 'cutin' ? 'CutIn' : '角色';
        document.getElementById('editor-title').textContent = `${icon} ${charName} ${label} Editor`;
    }
    buildPalette();
    renderThumbs();
    selectFrame(0);
}

async function switchMode(mode) {
    if (mode === currentMode) return;
    if (history.length > 0 && !confirm('切換模式會清空 undo 堆疊（已儲存的不影響），確定？')) return;
    currentMode = mode;
    document.getElementById('mode-character').classList.toggle('active', mode === 'character');
    document.getElementById('mode-bullet').classList.toggle('active', mode === 'bullet');
    document.getElementById('mode-shared').classList.toggle('active', mode === 'shared');
    document.getElementById('mode-cutin').classList.toggle('active', mode === 'cutin');
    await load();
}

function buildPalette() {
    // 收集所有幀出現過的顏色
    const colorSet = new Map();
    for (const frame of data.frames) {
        for (const px of frame) {
            if (!px) continue;
            const key = px.join(',');
            colorSet.set(key, (colorSet.get(key) || 0) + 1);
        }
    }
    // 按使用頻率排序
    palette = [...colorSet.entries()]
        .sort((a, b) => b[1] - a[1])
        .map(([k]) => k.split(',').map(Number));
    renderPalette();
}

function renderPalette() {
    const el = document.getElementById('palette');
    el.innerHTML = '';

    // 透明選項
    const transBtn = document.createElement('div');
    transBtn.className = 'swatch transparent';
    transBtn.title = '透明';
    if (currentIsTransparent) transBtn.classList.add('active');
    transBtn.onclick = () => { currentIsTransparent = true; renderPalette(); };
    el.appendChild(transBtn);

    for (const c of palette) {
        const div = document.createElement('div');
        div.className = 'swatch';
        div.style.background = rgbStr(c);
        div.title = rgbStr(c) + ' (sum ' + (c[0]+c[1]+c[2]) + ')\n右鍵：取代為...';
        if (!currentIsTransparent && pxEqual(c, currentColor)) div.classList.add('active');
        div.onclick = () => { currentIsTransparent = false; currentColor = c; renderPalette(); };
        div.oncontextmenu = (e) => { e.preventDefault(); openReplaceMenu(c, e.clientX, e.clientY); };
        el.appendChild(div);
    }
}

// ── 顏色取代（右鍵調色盤色塊 → 選 B → 取代本幀所有 A 為 B）─────────
let replaceFromColor = null;   // null = 透明；陣列 = RGB

function openReplaceMenu(fromColor, x, y) {
    replaceFromColor = fromColor;
    const menu = document.getElementById('replace-menu');
    const fromSwatch = document.getElementById('replace-from');
    fromSwatch.classList.toggle('transparent', !fromColor);
    fromSwatch.style.background = fromColor ? rgbStr(fromColor) : '';

    const grid = document.getElementById('replace-targets');
    grid.innerHTML = '';

    // 透明選項
    const transBtn = document.createElement('div');
    transBtn.className = 'swatch transparent';
    transBtn.title = '取代為透明';
    transBtn.onclick = (e) => { e.stopPropagation(); replaceColorInFrame(fromColor, null); closeReplaceMenu(); };
    grid.appendChild(transBtn);

    // 其他調色盤色（排除 A 自己）
    for (const c of palette) {
        if (fromColor && pxEqual(c, fromColor)) continue;
        const div = document.createElement('div');
        div.className = 'swatch';
        div.style.background = rgbStr(c);
        div.title = '取代為 ' + rgbStr(c);
        div.onclick = (e) => { e.stopPropagation(); replaceColorInFrame(fromColor, c); closeReplaceMenu(); };
        grid.appendChild(div);
    }

    // 防止跑出視窗右下：先定位再用 rect 反算調整
    menu.style.left = x + 'px';
    menu.style.top  = y + 'px';
    menu.classList.add('open');
    requestAnimationFrame(() => {
        const r = menu.getBoundingClientRect();
        const W = window.innerWidth, H = window.innerHeight;
        if (r.right > W) menu.style.left = Math.max(4, W - r.width - 4) + 'px';
        if (r.bottom > H) menu.style.top  = Math.max(4, H - r.height - 4) + 'px';
    });
}

function closeReplaceMenu() {
    document.getElementById('replace-menu').classList.remove('open');
    replaceFromColor = null;
}

function replaceColorInFrame(from, to) {
    pushHistory();
    const frame = data.frames[currentFrame];
    let count = 0;
    for (let i = 0; i < frame.length; i++) {
        if (pxEqual(frame[i], from)) {
            frame[i] = to ? [...to] : null;
            count++;
        }
    }
    // 同步重畫
    renderEditor();
    renderThumbs();
    renderPreview();
    // 短訊息
    const status = document.getElementById('status');
    status.className = 'ok';
    status.textContent = `✓ 本幀 ${count} 個像素已取代`;
    status.style.display = 'block';
    clearTimeout(window._replaceMsgTimer);
    window._replaceMsgTimer = setTimeout(() => {
        if (status.textContent.startsWith('✓ 本幀')) { status.className = ''; status.style.display = 'none'; }
    }, 2200);
}

function renderThumbs() {
    const el = document.getElementById('thumbs');
    el.innerHTML = '<h3>幀列表</h3>';
    for (let i = 0; i < data.frames.length; i++) {
        const div = document.createElement('div');
        div.className = 'thumb' + (i === currentFrame ? ' active' : '');
        div.onclick = () => selectFrame(i);

        const canvas = document.createElement('canvas');
        canvas.width = W; canvas.height = H;
        canvas.style.width = (48 * W / H) + 'px';  // CSS 鎖 48px 高，寬按比例
        const ctx = canvas.getContext('2d');
        const img = ctx.createImageData(W, H);
        for (let j = 0; j < W*H; j++) {
            const p = data.frames[i][j];
            img.data[j*4] = p ? p[0] : 0;
            img.data[j*4+1] = p ? p[1] : 0;
            img.data[j*4+2] = p ? p[2] : 0;
            img.data[j*4+3] = p ? 255 : 0;
        }
        ctx.putImageData(img, 0, 0);

        div.appendChild(canvas);
        const label = document.createElement('span');
        label.textContent = i + '. ' + frameLabel(i);
        div.appendChild(label);
        el.appendChild(div);
    }
}

function selectFrame(i) {
    currentFrame = i;
    document.getElementById('frame-title').textContent = `Frame ${i}: ${frameLabel(i)}`;
    clearSelection();
    renderEditor();
    renderThumbs();
    renderPreview();
}

function renderEditor() {
    const el = document.getElementById('editor');
    // 保留 overlay div（重建格子時別清掉）
    const overlay = document.getElementById('selection-overlay');
    el.innerHTML = '';
    if (overlay) el.appendChild(overlay);
    const frame = data.frames[currentFrame];

    for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
            const cell = document.createElement('div');
            cell.className = 'cell' + (frame[y*W+x] ? '' : ' transparent');
            if (frame[y*W+x]) {
                cell.style.background = rgbStr(frame[y*W+x]);
            }
            cell.dataset.x = x;
            cell.dataset.y = y;
            cell.onmousedown = (e) => {
                e.preventDefault();
                if (currentTool === 'select') return handleSelectMouseDown(e, x, y);
                isDragging = true;
                paint(e, x, y);
            };
            cell.onmouseenter = (e) => {
                if (dragState) return handleSelectMouseEnter(x, y);
                if (isDragging) paint(e, x, y);
            };
            cell.oncontextmenu = (e) => {
                e.preventDefault();
                if (currentTool === 'select') return;
                pushHistory();
                setCell(x, y, null);
            };
            el.appendChild(cell);
        }
    }
    renderSelectionOverlay();
}

function paint(e, x, y) {
    if (e.altKey) {
        // 取色
        const c = data.frames[currentFrame][y*W+x];
        if (c) { currentColor = c; currentIsTransparent = false; }
        else { currentIsTransparent = true; }
        renderPalette();
        return;
    }
    if (e.button === 2) return; // 右鍵已由 contextmenu 處理
    pushHistory();
    setCell(x, y, currentIsTransparent ? null : currentColor);
}

function setCell(x, y, color) {
    data.frames[currentFrame][y*W+x] = color ? [...color] : null;
    const cells = document.querySelectorAll('#editor .cell');
    const cell = cells[y*W+x];
    if (color) {
        cell.classList.remove('transparent');
        cell.style.background = rgbStr(color);
    } else {
        cell.classList.add('transparent');
        cell.style.background = '';
    }
    renderPreview();
    // 縮圖延遲更新（避免拖曳時卡頓）
    clearTimeout(window._thumbTimer);
    window._thumbTimer = setTimeout(renderThumbs, 100);
}

function renderPreview() {
    const canvas = document.getElementById('preview');
    const ctx = canvas.getContext('2d');
    const img = ctx.createImageData(W, H);
    const frame = data.frames[currentFrame];
    for (let j = 0; j < W*H; j++) {
        const p = frame[j];
        img.data[j*4] = p ? p[0] : 0;
        img.data[j*4+1] = p ? p[1] : 0;
        img.data[j*4+2] = p ? p[2] : 0;
        img.data[j*4+3] = p ? 255 : 0;
    }
    ctx.putImageData(img, 0, 0);
}

// ── 選取工具 ────────────────────────────────
function setTool(t) {
    if (t === currentTool || dragState) return;
    currentTool = t;
    document.getElementById('tool-paint').classList.toggle('active', t === 'paint');
    document.getElementById('tool-select').classList.toggle('active', t === 'select');
    document.getElementById('editor').classList.toggle('tool-select', t === 'select');
    if (t === 'paint') clearSelection();
}

function clearSelection() {
    sel = null;
    dragState = null;
    renderSelectionOverlay();
}

function handleSelectMouseDown(e, x, y) {
    if (isInSel(x, y)) {
        // 框內：開始移動
        pushHistory();
        const lifted = liftSelection();
        dragState = { mode: 'move', lifted, baseSel: { ...sel }, anchorX: x, anchorY: y, dx: 0, dy: 0 };
        repaintCells();
        renderSelectionOverlay();
        renderPreview();
    } else {
        // 框外：開始畫新選區
        dragState = { mode: 'define', x0: x, y0: y };
        sel = { x0: x, y0: y, x1: x, y1: y };
        renderSelectionOverlay();
    }
}

function handleSelectMouseEnter(x, y) {
    if (dragState.mode === 'define') {
        sel = normalizeBox(dragState.x0, dragState.y0, x, y);
        renderSelectionOverlay();
    } else if (dragState.mode === 'move') {
        const ndx = x - dragState.anchorX, ndy = y - dragState.anchorY;
        if (ndx === dragState.dx && ndy === dragState.dy) return;
        dragState.dx = ndx; dragState.dy = ndy;
        repaintCells();
        renderSelectionOverlay();
        renderPreview();
    }
}

function liftSelection() {
    const { x0, y0, x1, y1 } = sel;
    const w = x1 - x0 + 1, h = y1 - y0 + 1;
    const pixels = [];
    const frame = data.frames[currentFrame];
    for (let r = 0; r < h; r++) {
        for (let c = 0; c < w; c++) {
            const idx = (y0 + r) * W + (x0 + c);
            const px = frame[idx];
            pixels.push(px ? [...px] : null);
            frame[idx] = null;
        }
    }
    return { pixels, w, h };
}

function dropLifted() {
    const { lifted, baseSel, dx, dy } = dragState;
    const x0 = baseSel.x0 + dx, y0 = baseSel.y0 + dy;
    const frame = data.frames[currentFrame];
    for (let r = 0; r < lifted.h; r++) {
        for (let c = 0; c < lifted.w; c++) {
            const px = lifted.pixels[r * lifted.w + c];
            if (!px) continue;
            const tx = x0 + c, ty = y0 + r;
            if (tx < 0 || tx >= W || ty < 0 || ty >= H) continue;
            frame[ty * W + tx] = [...px];
        }
    }
    // 更新 sel 位置（裁切到 canvas 內）
    sel = {
        x0: Math.max(0, x0), y0: Math.max(0, y0),
        x1: Math.min(W - 1, x0 + lifted.w - 1), y1: Math.min(H - 1, y0 + lifted.h - 1),
    };
    if (sel.x0 > sel.x1 || sel.y0 > sel.y1) sel = null;  // 整個移出畫面
}

function repaintCells() {
    // 重畫所有 cell 顏色（不重建 DOM），含 lifted overlay
    const cells = document.querySelectorAll('#editor .cell');
    const frame = data.frames[currentFrame];
    for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
            const px = frame[y * W + x];
            const cell = cells[y * W + x];
            if (px) { cell.classList.remove('transparent'); cell.style.background = rgbStr(px); }
            else    { cell.classList.add('transparent');    cell.style.background = ''; }
        }
    }
    if (dragState && dragState.mode === 'move') {
        const { lifted, baseSel, dx, dy } = dragState;
        for (let r = 0; r < lifted.h; r++) {
            for (let c = 0; c < lifted.w; c++) {
                const px = lifted.pixels[r * lifted.w + c];
                if (!px) continue;
                const tx = baseSel.x0 + dx + c, ty = baseSel.y0 + dy + r;
                if (tx < 0 || tx >= W || ty < 0 || ty >= H) continue;
                const cell = cells[ty * W + tx];
                cell.classList.remove('transparent');
                cell.style.background = rgbStr(px);
            }
        }
    }
}

function renderSelectionOverlay() {
    const ov = document.getElementById('selection-overlay');
    if (!ov) return;
    let box = sel;
    if (dragState && dragState.mode === 'move') {
        box = {
            x0: dragState.baseSel.x0 + dragState.dx, y0: dragState.baseSel.y0 + dragState.dy,
            x1: dragState.baseSel.x1 + dragState.dx, y1: dragState.baseSel.y1 + dragState.dy,
        };
    }
    if (!box) { ov.style.display = 'none'; return; }
    const o = cellOriginToPx(box.x0, box.y0);
    const wPx = (box.x1 - box.x0 + 1) * (CELL_PX + GAP_PX) - GAP_PX;
    const hPx = (box.y1 - box.y0 + 1) * (CELL_PX + GAP_PX) - GAP_PX;
    ov.style.left = o.left + 'px';
    ov.style.top  = o.top + 'px';
    ov.style.width  = wPx + 'px';
    ov.style.height = hPx + 'px';
    ov.style.display = 'block';
}

// ── 歷史 / 復原 ─────────────────────────────
function pushHistory() {
    history.push(JSON.stringify(data.frames[currentFrame]));
    if (history.length > 50) history.shift();
}
function undo() {
    if (dragState) return;  // 拖移中不允許 undo
    const prev = history.pop();
    if (!prev) return;
    data.frames[currentFrame] = JSON.parse(prev);
    clearSelection();
    renderEditor();
    renderThumbs();
    renderPreview();
}

// ── 儲存 ────────────────────────────────────
async function save() {
    const status = document.getElementById('status');
    status.className = '';
    status.textContent = '儲存中...';
    status.style.display = 'block';
    try {
        const res = await fetch('/save?mode=' + currentMode, { method: 'POST', body: JSON.stringify(data) });
        const r = await res.json();
        if (r.ok) {
            status.className = 'ok';
            const target = currentMode === 'bullet' ? 'bullet-art.json'
                         : currentMode === 'cutin'  ? 'cutin-art.json'
                         : 'art.json';
            let msg = `✓ ${currentMode} 儲存成功（已更新 ${target} + 部署到 statusline）`;
            if (currentMode === 'cutin') msg += '\n⚠ 注意：CutIn.png 未同步；重跑 cutin CLI 會覆蓋';
            status.textContent = msg;
        } else {
            status.className = 'err';
            status.textContent = '✗ 儲存失敗：' + r.error;
        }
    } catch (e) {
        status.className = 'err';
        status.textContent = '✗ ' + e.message;
    }
}

// ── 事件綁定 ────────────────────────────────
document.addEventListener('mouseup', () => {
    isDragging = false;
    if (dragState) {
        if (dragState.mode === 'move') {
            dropLifted();
            repaintCells();
            renderSelectionOverlay();
            renderPreview();
            clearTimeout(window._thumbTimer);
            window._thumbTimer = setTimeout(renderThumbs, 100);
        }
        dragState = null;
    }
});
document.getElementById('save').onclick = save;
document.getElementById('undo').onclick = undo;
document.getElementById('reload').onclick = () => { if (confirm('重新載入？未儲存的變更會遺失！')) load(); };
document.getElementById('addColor').onclick = () => {
    const hex = document.getElementById('customColor').value;
    const rgb = hexRgb(hex);
    palette.unshift(rgb);
    currentColor = rgb;
    currentIsTransparent = false;
    renderPalette();
};

window.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
    else if (e.ctrlKey && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
    else if (e.key === '[' || e.key === ']') {
        const delta = e.key === ']' ? 1 : -1;
        const total = data ? data.frames.length : 12;
        selectFrame((currentFrame + delta + total) % total);
    }
    else if (e.key === 'Escape') {
        // Esc 優先關閉取代選單，否則清除選取
        if (document.getElementById('replace-menu').classList.contains('open')) closeReplaceMenu();
        else clearSelection();
    }
    else if (!e.ctrlKey && !e.altKey && !e.metaKey) {
        if (e.key.toLowerCase() === 'b') setTool('paint');
        else if (e.key.toLowerCase() === 'v') setTool('select');
    }
});

// 點到選單外 → 關閉
document.addEventListener('mousedown', (e) => {
    const menu = document.getElementById('replace-menu');
    if (menu.classList.contains('open') && !menu.contains(e.target)) closeReplaceMenu();
});

load();
</script>
